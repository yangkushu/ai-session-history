version: 2

project_name: ai-history

before:
  hooks:
    - go mod tidy

builds:
  - id: ai-history
    main: ./cmd/ai-history
    binary: ai-history
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/yangkushu/ai-session-history/internal/cli.version=v{{.Version}}
        -X github.com/yangkushu/ai-session-history/internal/cli.commit={{.Commit}}
        -X github.com/yangkushu/ai-session-history/internal/cli.buildDate={{.CommitDate}}

archives:
  - id: ai-history
    ids:
      - ai-history
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
